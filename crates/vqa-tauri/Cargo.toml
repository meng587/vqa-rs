[package]
name = "vqa-tauri"
# 版本单一来源（tauri.conf 不再设 version，updater/关于页都读这里）
version = "0.2.11"
edition.workspace = true
description = "视听质量检测工作站 —— Tauri/Web UI 版（vqa-core 复用）"

[[bin]]
name = "vqa-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 官方模板必须有这条：带它编译时，前端产物被内嵌进 exe（走自定义协议），
# 不带它就是 dev 语义——运行时去连 tauri.conf 里的 devUrl（127.0.0.1:5173）。
# 本仓库原先缺这条，导致 `cargo build` 出的 exe 连的是别的工程残留的 Vite 服务器，
# 前端改了也永远看不到效果（实测踩坑，务必保留）。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
vqa-core = { path = "../vqa-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
windows.workspace = true
