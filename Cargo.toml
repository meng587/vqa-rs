[workspace]
resolver = "2"
members = ["crates/vqa-core", "crates/vqa-app", "crates/vqa-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = "0.4"
eframe = "0.28"
egui = "0.28"
egui_extras = "0.28"
egui_plot = "0.28"
miow = "0.6"
socket2 = "0.5"
rfd = "0.14"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[profile.release]
lto = "thin"
codegen-units = 1
